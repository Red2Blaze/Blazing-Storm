name: Viewer Live Link regression

on:
  pull_request:
    paths:
      - "tools/blender-live-link/tests/test_manifest_outputs.py"
      - "indra/newview/viewer_manifest.py"
      - "indra/newview/blazingstorm/blender/**"
      - ".github/workflows/blender-live-link-tests.yaml"
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test viewer manifest GitHub output integration
        run: python -m unittest discover -s tools/blender-live-link/tests -p "test_manifest_outputs.py" -v
