name: Build Animation Permission Revoke Experiment

on:
  push:
    branches:
      - experiment/animation-permission-revocation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blazing-animrevoke-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
  AUTOBUILD_VSVER: "170"
  PYTHONUTF8: "1"

# Isolated Windows-only validation; never updates the production latest-test release.
jobs:
  windows:
    name: Windows x64 experimental installer
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Blazing Storm
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        id: py311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set Python environment for CMake
        shell: bash
        run: echo "PYTHON=${{ steps.py311.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install Autobuild dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          autobuild --version

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $nsis) {
            choco install nsis --no-progress -y
            $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          }

          if (-not $nsis) {
            $candidate = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $candidate)
              & $candidate /VERSION
            }
            else {
              throw "NSIS makensis.exe could not be found after installation."
            }
          }
          else {
            & $nsis.Source /VERSION
          }

      - name: Cache Autobuild packages
        uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: blazing-windows64-${{ hashFiles('autobuild.xml', 'build-variables/variables') }}
          restore-keys: |
            blazing-windows64-

      - name: Configure Blazing Storm package
        shell: bash
        run: >
          autobuild configure -A 64 -c ReleaseFS_open --
          --package
          --chan BlazingStorm-AnimRevoke-Test
          -DLL_TESTS:BOOL=FALSE

      - name: Build installer
        shell: bash
        run: autobuild build -A 64 -c ReleaseFS_open --no-configure

      - name: Collect latest installer
        id: package
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build-*\newview\Release\*Setup.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $setup) {
            Write-Host "No *Setup.exe installer was found. Executables produced by the build:"
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build-*" -Filter *.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Viewer build finished without a packaged Windows installer."
          }

          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $installer = Join-Path $dist "Blazing-Storm-AnimRevoke-Experimental-Windows-x64.exe"
          Copy-Item $setup.FullName $installer -Force

          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Blazing-Storm-AnimRevoke-Experimental-Windows-x64.exe" |
            Set-Content -Path (Join-Path $dist "Blazing-Storm-AnimRevoke-Experimental-Windows-x64.sha256") -Encoding ascii

          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "original_name=$($setup.Name)" >> $env:GITHUB_OUTPUT

          Write-Host "Installer: $($setup.FullName)"
          Write-Host "SHA256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Blazing-Storm-AnimRevoke-Experimental-Windows-x64
          path: |
            dist/Blazing-Storm-AnimRevoke-Experimental-Windows-x64.exe
            dist/Blazing-Storm-AnimRevoke-Experimental-Windows-x64.sha256
          retention-days: 14
          if-no-files-found: error

