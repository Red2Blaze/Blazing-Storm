            dist/Blazing-Storm-Latest-Windows-x64-AVX2.sha256
          retention-days: 14
          if-no-files-found: error


  linux:
    name: Linux x64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      XZ_DEFAULTS: "-T0"

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: false

      - name: Checkout Blazing Storm
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        id: py311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set Python environment for CMake
        shell: bash
        run: echo "PYTHON=${{ steps.py311.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common \
            build-essential \
            mesa-common-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxinerama-dev \
            libxrandr-dev \
            libpulse-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libssl-dev \
            python3-setuptools \
            wget

          sudo add-apt-repository -y -n ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install Autobuild dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          autobuild --version

      - name: Cache Autobuild packages
        uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: blazing-linux64-${{ hashFiles('autobuild.xml', 'build-variables/variables') }}
          restore-keys: |
            blazing-linux64-

      - name: Configure Blazing Storm package
        shell: bash
        run: >
          autobuild configure -A 64 -c ReleaseFS_open --
          --package
          --chan BlazingStorm
          -DLL_TESTS:BOOL=FALSE
          -DNDOF:BOOL=FALSE

      - name: Build Linux package
        shell: bash
        run: autobuild build -A 64 -c ReleaseFS_open --no-configure

      - name: Collect Linux package
        shell: bash
        run: |
          mkdir -p dist
          package="$(find build-linux-*/newview -maxdepth 1 -type f -name '*.tar.xz' -print -quit)"
          if [ -z "$package" ]; then
            echo "No .tar.xz package found. Available archives:"
            find build-linux-*/newview -maxdepth 1 -type f -name '*.xz' -print || true
            find build-linux-*/newview -maxdepth 1 -type f -name '*.bz2' -print || true
            exit 1
          fi

          cp "$package" dist/Blazing-Storm-Latest-Linux-x64.tar.xz
          sha256sum dist/Blazing-Storm-Latest-Linux-x64.tar.xz |
            sed 's#dist/##' > dist/Blazing-Storm-Latest-Linux-x64.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: Blazing-Storm-Latest-Linux-x64
          path: |
            dist/Blazing-Storm-Latest-Linux-x64.tar.xz
            dist/Blazing-Storm-Latest-Linux-x64.sha256
          retention-days: 14
          if-no-files-found: error

