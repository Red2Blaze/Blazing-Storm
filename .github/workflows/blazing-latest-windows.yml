            dist/Blazing-Storm-Latest-Linux-x64-AVX2.sha256
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS 64-bit DMG
    runs-on: macos-15
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Install Bash and GNU sed
        shell: bash
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install bash gnu-sed
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Checkout Blazing Storm
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        id: py311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: true

      - name: Set Python environment for CMake
        shell: bash
        run: echo "PYTHON=${{ steps.py311.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install Autobuild dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          autobuild --version

      - name: Cache Autobuild packages
        uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: blazing-macos64-${{ hashFiles('autobuild.xml', 'build-variables/variables') }}
          restore-keys: |
            blazing-macos64-

      - name: Configure Blazing Storm package
        shell: bash
        run: >
          autobuild configure -A 64 -c ReleaseFS_open --
          --package
          --chan BlazingStorm
          -DLL_TESTS:BOOL=FALSE

      - name: Build macOS package
        shell: bash
        run: autobuild build -A 64 -c ReleaseFS_open --no-configure

      - name: Collect macOS DMG
        shell: bash
        run: |
          mkdir -p dist
          package="$(find build-darwin-*/newview -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$package" ]; then
            echo "No DMG package found. Build output:"
            find build-darwin-*/newview -maxdepth 2 -type f -print || true
            exit 1
          fi

          cp "$package" dist/Blazing-Storm-Latest-macOS.dmg
          shasum -a 256 dist/Blazing-Storm-Latest-macOS.dmg |
            sed 's#dist/##' > dist/Blazing-Storm-Latest-macOS.sha256

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Blazing-Storm-Latest-macOS
          path: |
            dist/Blazing-Storm-Latest-macOS.dmg
            dist/Blazing-Storm-Latest-macOS.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish latest test build
    runs-on: ubuntu-latest
    needs:
      - windows
      - windows_avx2
      - linux
      - linux_avx2
      - macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Blazing-Storm-Latest-*
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          ls -lh release-assets
          test -f release-assets/Blazing-Storm-Latest-Windows-x64.exe
          test -f release-assets/Blazing-Storm-Latest-Windows-x64-AVX2.exe
          test -f release-assets/Blazing-Storm-Latest-Linux-x64.tar.xz
          test -f release-assets/Blazing-Storm-Latest-Linux-x64-AVX2.tar.xz
          test -f release-assets/Blazing-Storm-Latest-macOS.dmg

      - name: Update permanent latest-test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f latest-test "$GITHUB_SHA"
          git push origin refs/tags/latest-test --force

          short_sha="$(git rev-parse --short=7 HEAD)"
          win_sha="$(awk '{print $1}' release-assets/Blazing-Storm-Latest-Windows-x64.sha256)"
          win_avx2_sha="$(awk '{print $1}' release-assets/Blazing-Storm-Latest-Windows-x64-AVX2.sha256)"
          linux_sha="$(awk '{print $1}' release-assets/Blazing-Storm-Latest-Linux-x64.sha256)"
          linux_avx2_sha="$(awk '{print $1}' release-assets/Blazing-Storm-Latest-Linux-x64-AVX2.sha256)"
          mac_sha="$(awk '{print $1}' release-assets/Blazing-Storm-Latest-macOS.sha256)"

          cat > release-notes.md <<EOF
          Automatically built from the latest commit on master.

          Commit: $short_sha

          Downloads:
          - Windows x64: Blazing-Storm-Latest-Windows-x64.exe
          - Windows x64 AVX2: Blazing-Storm-Latest-Windows-x64-AVX2.exe
          - Linux x64: Blazing-Storm-Latest-Linux-x64.tar.xz
          - Linux x64 AVX2: Blazing-Storm-Latest-Linux-x64-AVX2.tar.xz
          - macOS 64-bit: Blazing-Storm-Latest-macOS.dmg

          AVX2 builds are for newer x86-64 CPUs with AVX2 support. Use the regular build if you are unsure.

          SHA256:
          - Windows: $win_sha
          - Windows AVX2: $win_avx2_sha
          - Linux: $linux_sha
          - Linux AVX2: $linux_avx2_sha
          - macOS: $mac_sha

          These are unsigned test builds. Windows SmartScreen and macOS Gatekeeper may display security warnings.
          EOF

          if gh release view latest-test >/dev/null 2>&1; then
            gh release edit latest-test \
              --title "Blazing Storm - Latest Test Build" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create latest-test \
              --target "$GITHUB_SHA" \
              --title "Blazing Storm - Latest Test Build" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload latest-test release-assets/* --clobber
